<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>excali</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body, #root { margin: 0; height: 100%; }
      .layout { display: flex; height: 100%; }
      main { flex: 1; position: relative; }
      .sidebar { position: relative; flex: none; width: 220px; }
      .sidebar.collapsed { width: 52px; }
      .sidebar-rail { height: 100%; padding: 12px 8px; box-sizing: border-box; border-right: 1px solid #e9ecef; background: #f8f9fa; }
      .sidebar-toggle {
        display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0;
        border: 0; border-radius: 8px; background: #e9ecef; color: #495057; cursor: pointer;
      }
      .sidebar-toggle:hover { background: #dee2e6; color: #212529; }
      .file-list {
        width: 220px; height: 100%; padding: 12px 8px; overflow-y: auto; box-sizing: border-box;
        border-right: 1px solid #e9ecef; background: #f8f9fa;
        font: 14px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      }
      .sidebar.collapsed .file-list { position: absolute; top: 0; left: 0; z-index: 20; box-shadow: 4px 0 16px rgba(0, 0, 0, 0.12); visibility: hidden; }
      .sidebar.collapsed:hover .file-list { visibility: visible; transition: visibility 0s 0.15s; }
      .file-list header { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
      .file-list header h2 { margin: 0 6px; }
      .file-item { position: relative; display: flex; align-items: center; margin-bottom: 2px; border-radius: 6px; color: #343a40; }
      .file-item:hover { background: #e9ecef; }
      .file-item.active { background: #d0ebff; color: #1864ab; font-weight: 600; }
      .file-open {
        flex: 1; min-width: 0; padding: 8px 10px; text-align: left; border: 0; background: transparent; color: inherit;
        cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: inherit;
      }
      .file-actions { display: none; flex: none; gap: 2px; padding-right: 4px; }
      .file-item:hover .file-actions { display: flex; }
      .file-actions button {
        display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0;
        border: 0; border-radius: 4px; background: transparent; color: #868e96; cursor: pointer;
      }
      .file-actions button:hover { background: #ced4da; color: #212529; }
      .file-item.editing input {
        width: 100%; padding: 7px 9px; border: 1px solid #4dabf7; border-radius: 6px; outline: none; font: inherit; box-sizing: border-box;
      }
      .file-list h2 { margin: 12px 10px 6px; font-size: 12px; font-weight: 600; color: #868e96; }
      .file-list h2:first-child { margin-top: 0; }
      .file-list .folder { display: block; font-size: 11px; font-weight: 400; color: #adb5bd; overflow: hidden; text-overflow: ellipsis; }
      .font-picker {
        position: absolute; top: 16px; right: 16px; z-index: 10; padding: 6px 8px;
        border: 1px solid #ced4da; border-radius: 6px; background: #fff; color: #343a40;
        font: 14px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      }
      .drop-overlay, .notice { font: 16px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      .drop-overlay {
        position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center;
        background: rgba(208, 235, 255, 0.85); border: 3px dashed #1c7ed6; color: #1864ab; font-weight: 600;
      }
      .notice {
        position: fixed; left: 50%; bottom: 24px; z-index: 1001; transform: translateX(-50%);
        padding: 10px 16px; border-radius: 8px; background: #343a40; color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
